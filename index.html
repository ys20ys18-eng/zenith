<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈페이지</title>
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #2563eb;
      --max: 960px;
      --gutter: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c0a09;
        --fg: #fafaf9;
        --muted: #a8a29e;
        --line: #292524;
        --accent: #60a5fa;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c0a09;
      --fg: #fafaf9;
      --muted: #a8a29e;
      --line: #292524;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }
    section {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
    }
    section > .wrap { width: 100%; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.05; margin: 0 0 0.5em; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.5rem, 4vw, 2.25rem); margin: 0 0 0.75em; letter-spacing: -0.01em; }
    p { margin: 0 0 1em; color: var(--muted); max-width: 60ch; }
    .eyebrow { color: var(--accent); font-size: 0.875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

    /* Hero entrance: runs once on load */
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    [data-enter] { animation: rise 0.8s ease-out both; }
    [data-enter="2"] { animation-delay: 0.12s; }
    [data-enter="3"] { animation-delay: 0.24s; }

    /* Cards */
    .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); }
    .card h3 { margin: 0 0 8px; font-size: 1.125rem; }
    .card p { margin: 0; font-size: 0.95rem; }

    /* Buttons and links */
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--fg);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .link { color: var(--fg); text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size 0.3s ease; }
    .link:hover { background-size: 100% 1px; }

    footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 0.875rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <section id="top">
    <div class="wrap">
      <p class="eyebrow" data-enter>Personal homepage</p>
      <h1 data-enter="2">홈페이지</h1>
      <p data-enter="2">만든 것과 하는 일을 한곳에 모아 둔 공간입니다.</p>
      <a class="btn" href="#work" data-enter="3">작업 보기</a>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <p class="eyebrow">Work</p>
      <h2>작업</h2>
      <div class="grid">
        <a class="card" href="#"><h3>프로젝트 하나</h3><p>간단한 설명을 여기에 적습니다.</p></a>
        <a class="card" href="#"><h3>프로젝트 둘</h3><p>간단한 설명을 여기에 적습니다.</p></a>
        <a class="card" href="#"><h3>프로젝트 셋</h3><p>간단한 설명을 여기에 적습니다.</p></a>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <h2>연락</h2>
      <p>메일이나 다른 채널로 편하게 연락 주세요.</p>
      <a class="link" href="#">이메일 보내기</a>
    </div>
  </section>

  <footer>
    <div class="wrap">© 홈페이지</div>
  </footer>
</body>
</html>
